<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autokaart · varianten op Zacht licht en Fijne lijn</title><style>
body{font:14px/1.45 system-ui;margin:0;padding:24px;background:#14171c;color:#e7e9ee;--primary-text-color:#e7e9ee;--secondary-text-color:#a7aeb9;--ha-card-background:#22252c;--card-background-color:#22252c;--secondary-background-color:#2d323c;--divider-color:#3c434f;--primary-color:#efa900;color-scheme:dark}main{max-width:1000px;margin:auto}h1{font-size:24px}h2{font-size:16px;margin-bottom:4px}p{color:var(--secondary-text-color)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}article{min-width:0}eleven-car-card,eleven-car-bar-study{height:auto;display:block}.tools{display:flex;gap:16px;flex-wrap:wrap}.tools label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}input{accent-color:#efa900}output{font-variant-numeric:tabular-nums;min-width:48px}@media(max-width:650px){.cards{grid-template-columns:1fr}body{padding:16px}}
</style></head><body><main><h1>Zacht licht en Fijne lijn - verder uitgewerkt</h1><p>Bovenaan de twee originelen, daaronder zes nieuwe voorstellen. Alle kaarten tonen dezelfde fictieve laadsessie. Alleen deze voorbeelden gebruiken de nieuwe stijlen.</p><div class="tools"><label>Laadvermogen <input id="power" type="range" min="0" max="22" step="0.5" value="6"><output id="power-value"></output></label><label>Snelheid <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"><output id="speed-value"></output></label><label>Maximaal kW <input id="maximum" type="number" min="0.1" max="500" step="0.1" value="11" style="width:70px"></label></div><div class="cards"></div></main><script src="../dist/eleven-car-card.js"></script><script type="module" src="bar-refinements.js"></script></body></html>
