<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eleven Media Player · Studio en Horizontaal</title><style>
:root{color-scheme:dark;--ha-card-background:#24252d;--card-background-color:#24252d;--secondary-background-color:#1d1e25;--primary-text-color:#ebeef4;--secondary-text-color:#abb2c0;--divider-color:#ffffff18;--primary-color:#5aabef;--text-primary-color:#101820;--ha-card-border-radius:12px}body{margin:0;background:#131419;font:14px/1.5 system-ui;color:var(--primary-text-color)}main{max-width:1280px;margin:auto;padding:28px}h1{font-size:26px;margin:0 0 8px}p{color:var(--secondary-text-color)}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button,select{font:inherit;background:var(--ha-card-background);color:inherit;border:1px solid var(--divider-color);border-radius:8px;padding:9px;cursor:pointer}.examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:start}article{min-width:0}article h2{font-size:16px;margin:0 0 6px}article>p{font-size:13px;min-height:40px;margin:0 0 14px}eleven-media-player-card{display:block;height:auto}details{font-size:12px;color:var(--secondary-text-color);margin-top:12px}summary{cursor:pointer;padding:6px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.examples.narrow{grid-template-columns:repeat(auto-fit,280px)}body.light{color-scheme:light;background:#edf0f4;--ha-card-background:#fff;--card-background-color:#fff;--secondary-background-color:#f1f3f6;--primary-text-color:#242833;--secondary-text-color:#606978;--divider-color:#23304820;--primary-color:#1671bd;--text-primary-color:#fff}.events{margin-top:30px;padding:14px;border-radius:8px;background:var(--secondary-background-color)}@media(max-width:1000px){.examples{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.examples,.examples.narrow{grid-template-columns:minmax(0,1fr)}main{padding:18px}}
</style><script type="module" src="examples.js"></script></head><body><main><h1>Mediaspeler · Studio en Horizontaal</h1><p>Studio met muziek staat voorop. Vergelijk optie 4 (Studio) en optie 3 (Horizontaal) en probeer afspelen, volume en bronkeuze. Alle opdrachten blijven in deze demo; er worden geen echte apparaten bediend.</p><div class="controls"><button id="theme">Wissel thema</button><button id="width">Wissel breedte</button><label>Albumcover <select id="cover"><option value="light" selected>Licht</option><option value="dark">Donker</option></select></label><label>Demo <select id="state"><option value="music" selected>Muziek</option><option value="tv">Televisie</option><option value="idle">Inactief</option><option value="off">Uit</option><option value="unavailable">Niet beschikbaar</option><option value="offline">Geen verbinding</option></select></label></div><div class="examples"></div><div class="events"><strong>Laatste demo-opdracht</strong><pre id="last-command">Nog geen opdracht.</pre></div><pre id="checks" role="status"></pre></main></body></html>
