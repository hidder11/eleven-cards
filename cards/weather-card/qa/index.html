<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eleven Weather · voorbeeld</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:14px/1.45 system-ui,sans-serif;background:#f2f4f7;color:var(--primary-text-color);--primary-text-color:#20252b;--secondary-text-color:#626b78;--card-background-color:#fff;--ha-card-background:#fff;--secondary-background-color:#edf0f4;--divider-color:#dce1e8;--primary-color:#996300;color-scheme:light}body.dark{background:#14171c;--primary-text-color:#e7e9ee;--secondary-text-color:#a7aeb9;--card-background-color:#22252c;--ha-card-background:#22252c;--secondary-background-color:#2d323c;--divider-color:#3c434f;--primary-color:#efa900;color-scheme:dark}main{max-width:1000px;margin:auto}h1{font-size:25px;margin:0 0 8px;letter-spacing:-.03em}p{color:var(--secondary-text-color);margin:0 0 20px}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}button,select{font:inherit;font-size:12px;padding:8px 12px;background:var(--secondary-background-color);color:inherit;border:1px solid var(--divider-color);border-radius:7px;cursor:pointer}.examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}.examples.narrow{grid-template-columns:280px;justify-content:center}article{min-width:0}article>h2{font-size:16px;margin:0 0 12px}eleven-weather-card{display:block}#last-event{font-size:12px;margin-top:16px}button:focus-visible,select:focus-visible{outline:2px solid var(--primary-color);outline-offset:3px}@media(max-width:700px){body{padding:16px}.examples{grid-template-columns:minmax(0,1fr)}}
</style></head><body class="dark"><main><h1>Het weer · dezelfde kaartstijl</h1><p>Compact, met een achtergrond die de weerstatus volgt. Alle gegevens in dit voorbeeld zijn fictief.</p><div class="tools"><button id="theme">Licht thema</button><label>Achtergrond <select id="background"></select></label><button id="motion" aria-pressed="true">Animatie uit</button><button id="compact" aria-pressed="false">Compacte weergave</button><button id="width">Smalle kaarten</button><label>Verwachting <select id="forecast"><option value="hourly">Per uur</option><option value="daily">Per dag</option><option value="none">Geen verwachting</option></select></label><label>Veld links <select id="metric-primary"></select></label><label>Veld rechts <select id="metric-secondary"></select></label><button id="offline">Verbinding verbreken</button></div><div class="examples"><article><h2>Zonnig</h2><eleven-weather-card data-weather="sunny"></eleven-weather-card></article><article><h2>Regen</h2><eleven-weather-card data-weather="rainy"></eleven-weather-card></article><article><h2>Halfbewolkt</h2><eleven-weather-card data-weather="partlycloudy"></eleven-weather-card></article><article><h2>Heldere nacht</h2><eleven-weather-card data-weather="clear-night"></eleven-weather-card></article></div><p id="last-event" role="status"></p><div id="editor" hidden></div></main><script src="../dist/eleven-weather-card.js"></script><script src="../../heatmap-card/qa/ha-form-fixture.js"></script><script type="module" src="fixture.js"></script></body></html>
