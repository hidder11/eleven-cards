<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Eleven Scene Engine · synthetische demo</title><style>
:root{--primary-text-color:#202124;--secondary-text-color:#545b64;--primary-color:#006b96;--card-background-color:#fff;--divider-color:#d8dce2;--secondary-background-color:#edf0f3;--error-color:#b3261e}body{margin:0;background:#f2f4f6;color:var(--primary-text-color);font:14px/1.45 system-ui,sans-serif;padding:24px}main{max-width:480px;margin:auto}header.demo{margin:0 0 20px}header.demo p{color:var(--secondary-text-color);margin:4px 0}h1{font-size:20px;margin:0}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}select,nav button{font:inherit;padding:8px;min-height:44px;color:inherit;border:1px solid var(--divider-color);background:var(--card-background-color);border-radius:6px}.dark{--primary-text-color:#edf0f4;--secondary-text-color:#b6bdc8;--primary-color:#80c7ef;--card-background-color:#202329;--divider-color:#454c57;--secondary-background-color:#2d323b;--error-color:#ffb4ab;background:#15171b}@media(max-width:400px){body{padding:12px}}
</style><main><header class="demo"><h1>Eleven Scene Engine</h1><p>Synthetische demo · lokaal voorstel</p><p>Geen Home Assistant-verbinding. Reset is nagebootst.</p><nav><select id="scenario" aria-label="Demo-status"><option value="normal">Actieve aanvragen</option><option value="default">Standaardscene</option><option value="empty">Leeg</option><option value="offline">Geen verbinding</option><option value="long">Lange labels</option><option value="missing">Entiteit ontbreekt</option><option value="unknown">Onbekend</option><option value="unavailable">Niet beschikbaar</option></select><button id="theme">Licht / donker</button></nav></header><eleven-scene-engine-card></eleven-scene-engine-card></main><script type="module">
import './eleven-scene-engine-card.js';
const card = document.querySelector('eleven-scene-engine-card');
const entity = 'eleven_scene_engine.woonkamer', reset = 'button.eleven_scene_engine_woonkamer_reset';
window.calls = []; window.serviceMode = 'success'; window.card = card;
window.load = (scenario='normal')=>{
 const requests=[{engine:'Woonkamer',identifier:'Filmavond',scene:'scene.woonkamer_film',priority:80,requires:null,until:null},{engine:'Woonkamer',identifier:'Basis',scene:'scene.woonkamer_basis',priority:0,requires:null,until:null},{engine:'Woonkamer',identifier:'Nachtlicht',scene:'scene.woonkamer_nacht',priority:20,requires:'Nacht',until:'2026-10-29T23:00:00+01:00'}];
 const attrs={engine:'Woonkamer',default_scene:'scene.woonkamer_basis',revision:12,snapshot_source:'add_request:Filmavond',requests,request_count:3,active_requests:requests.slice(0,2),active_request_count:2,non_active_requests:requests.slice(2),non_active_request_count:1,effective_request:requests[0]};
 if(scenario==='empty'||scenario==='default'){Object.assign(attrs,{requests:[],request_count:0,active_requests:[],active_request_count:0,non_active_requests:[],non_active_request_count:0,effective_request:scenario==='default'?{identifier:'default_scene',scene:attrs.default_scene,priority:-1,is_default:true}:null});}
 if(scenario==='long'){attrs.engine='Woonkamer en eetkamer aan de achterzijde';attrs.effective_request={...requests[0],identifier:'Een bijzonder lange aanvraag voor een gezellige filmavond met vrienden',scene:'scene.woonkamer_extra_lange_scene_voor_de_hele_benedenverdieping'};}
 const states={[entity]:{state:attrs.effective_request?.scene || 'idle',attributes:attrs,last_updated:'2026-10-29T18:00:00Z'},[reset]:{state:'unknown',attributes:{}},'scene.woonkamer_film':{attributes:{friendly_name:'Filmavond'}},'scene.woonkamer_basis':{attributes:{friendly_name:'Rustig thuis'}}};
 if(scenario==='missing')delete states[entity];if(['unknown','unavailable'].includes(scenario))states[entity].state=scenario;
 const hass={connected:scenario!=='offline',locale:{language:'nl-NL'},states,services:{button:{press:{}}},callService:(domain,service,data)=>{window.calls.push([domain,service,data]); if(window.serviceMode==='pending')return new Promise((resolve,reject)=>{window.resolveService=resolve;window.rejectService=reject});if(window.serviceMode==='error')return Promise.reject(new Error('Geen toestemming (synthetisch)'));return Promise.resolve();}};
 window.hass=hass;card.hass=hass;
};
window.configure = extra=>card.setConfig({type:'custom:eleven-scene-engine-card',entity,reset_entity:reset,show_details:true,...extra});
window.configure();window.load();
document.querySelector('#scenario').onchange=e=>window.load(e.target.value);
document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');
window.ready=true;
</script></html>
