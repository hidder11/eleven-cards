<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eleven Camera · synthetische preview</title><style>
:root{color-scheme:dark;--ha-card-background:#24252d;--card-background-color:#24252d;--secondary-background-color:#1d1e25;--primary-text-color:#ebeef4;--secondary-text-color:#abb2c0;--divider-color:#ffffff18;--primary-color:#5aabef;--ha-card-border-radius:12px}body{margin:0;background:#131419;font:14px/1.5 system-ui;color:var(--primary-text-color)}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:24px}p{color:var(--secondary-text-color)}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;background:var(--ha-card-background);color:inherit;border:1px solid var(--divider-color);border-radius:8px;padding:8px;cursor:pointer}.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.cards>article{min-width:0}.cards.narrow{grid-template-columns:260px 260px}eleven-camera-card{display:block;height:auto}body.light{color-scheme:light;background:#edf0f4;--ha-card-background:#fff;--card-background-color:#fff;--secondary-background-color:#f1f3f6;--primary-text-color:#242833;--secondary-text-color:#606978;--divider-color:#23304820}pre{white-space:pre-wrap;font-size:12px}@media(max-width:720px){.cards,.cards.narrow{grid-template-columns:minmax(0,1fr)}}
</style><script type="module" src="camera.js"></script></head><body><main><h1>Eleven Camera</h1><p>Fictieve camera’s met een gesimuleerde Home Assistant-speler. Deze preview test geen echte videostreams.</p><div class="controls"><button id="theme">Licht thema</button><button id="width">Smalle kaarten</button><button id="availability">Voordeur onbeschikbaar</button><button id="offline">Verbinding verbreken</button><select id="background" aria-label="Achtergrond"></select></div><div class="cards"><article><h2>Raster</h2><eleven-camera-card id="grid"></eleven-camera-card></article><article><h2>Tabbladen</h2><eleven-camera-card id="tabs"></eleven-camera-card></article></div><pre id="checks" role="status"></pre></main></body></html>
