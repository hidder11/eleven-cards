<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera en viewer</title>
<style>
:root{color-scheme:dark;--ha-card-background:#24252d;--card-background-color:#24252d;--secondary-background-color:#1d1e25;--primary-text-color:#ebeef4;--secondary-text-color:#abb2c0;--divider-color:#ffffff18;--primary-color:#5aabef;--ha-card-border-radius:12px}body{margin:0;background:#131419;font:14px/1.5 system-ui;color:var(--primary-text-color)}main{max-width:1150px;margin:auto;padding:24px}.cards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:24px;align-items:start}article{min-width:0}eleven-camera-card,eleven-camera-viewer-card{display:block}button{font:inherit;background:var(--ha-card-background);color:inherit;border:1px solid var(--divider-color);border-radius:8px;padding:10px;cursor:pointer}p{color:var(--secondary-text-color)}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}pre{white-space:pre-wrap}body.light{color-scheme:light;background:#edf0f4;--ha-card-background:#fff;--card-background-color:#fff;--secondary-background-color:#f1f3f6;--primary-text-color:#242833;--secondary-text-color:#606978;--divider-color:#23304820}.cards.narrow{max-width:320px;grid-template-columns:minmax(0,1fr)}@media(max-width:720px){.cards{grid-template-columns:minmax(0,1fr)}}
</style><script type="module" src="viewer.js"></script></head>
<body><main><h1>Camera en viewer</h1><p>Klik op het beeld of de naam van Voordeur of Tuin. De gekoppelde viewer toont de gekozen camera. Fictieve beelden; er worden geen echte camera's of opdrachten gebruikt.</p><div class="controls"><button id="theme">Wissel thema</button><button id="width">Wissel breedte</button><button id="offline">Verbinding wisselen</button></div><div class="cards"><article><h2>Cameraoverzicht</h2><eleven-camera-card id="source"></eleven-camera-card></article><article><h2>Gekoppelde viewer</h2><eleven-camera-viewer-card id="viewer"></eleven-camera-viewer-card></article></div><pre id="checks" role="status"></pre></main></body></html>
