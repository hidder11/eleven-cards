<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eleven Security · werkende kaart</title><style>
:root{color-scheme:dark;--ha-card-background:#242b34;--card-background-color:#242b34;--secondary-background-color:#2b3540;--primary-text-color:#eef2f6;--secondary-text-color:#abb7c4;--divider-color:#ffffff18;--primary-color:#81b6e5;--ha-card-border-radius:12px}*{box-sizing:border-box}body{margin:0;background:#151b22;color:var(--primary-text-color);font:14px/1.5 system-ui}main{max-width:950px;margin:auto;padding:24px}h1{font-size:23px}p{color:var(--secondary-text-color)}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0;align-items:end}.controls label{display:grid;gap:4px;font-size:12px}button,select{font:inherit;background:var(--ha-card-background);color:inherit;border:1px solid var(--divider-color);border-radius:8px;padding:8px;cursor:pointer}.preview{width:420px;max-width:100%}.preview.narrow{width:260px}eleven-camera-card{display:block;height:auto}body.light{color-scheme:light;background:#edf0f4;--ha-card-background:#fff;--card-background-color:#fff;--secondary-background-color:#f1f3f6;--primary-text-color:#242833;--secondary-text-color:#606978;--divider-color:#23304820}pre{white-space:pre-wrap;font-size:12px}</style><script type="module" src="security.js"></script></head><body><main><h1>Securitykaart</h1><p>Werkende kaart met fictieve Home Assistant-entiteiten, detecties en gesimuleerde beelden. Er worden geen echte apparaten bediend.</p><div class="controls"><label>Situatie<select id="scenario"><option value="quiet">Rust</option><option value="person">Persoonsdetectie</option><option value="open">Open raam</option><option value="alarm">Alarm actief</option><option value="unknown">Onbekende gegevens</option><option value="offline">Geen verbinding</option></select></label><label>Tabblad<select id="view"><option value="cameras">Camera’s</option><option value="activity">Activiteiten</option></select></label><button id="width">Smalle kaart</button><button id="theme">Licht thema</button><button id="history">Geschiedenisfout</button></div><div class="preview"><eleven-camera-card></eleven-camera-card></div><pre id="checks"></pre></main></body></html>
