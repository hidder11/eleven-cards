<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eleven House synthetic fixture</title>
<style>
:root{font-family:system-ui;--primary-text-color:#edf0f4;--secondary-text-color:#abb2bd;--secondary-background-color:#282b30;--ha-card-background:#1c1e20;--divider-color:#363b41;--primary-color:#8db6ed;color:var(--primary-text-color);background:#121416}
:root[data-theme=light]{--primary-text-color:#20252b;--secondary-text-color:#626b76;--secondary-background-color:#edf0f3;--ha-card-background:#fff;--divider-color:#dce1e6;background:#f2f3f5}
body{margin:0;padding:0}#mount{max-width:460px;margin:auto}eleven-house-card{display:block}p{font-size:12px}button{min-height:44px}
</style><div id="mount"><eleven-house-card id="house"></eleven-house-card></div><p>Synthetic rendering and readings; no Home Assistant connection.</p>
<script type="module">
import '../dist/eleven-house-card.js';
customElements.define('ha-form',class extends HTMLElement{});
window.calls=[];window.info=[];
window.config={type:'custom:eleven-house-card',manifest:'/fixture/manifest.json',view:'front',mode:'afternoon',title:'Example home',show_view_toggle:true,show_presence:true,presence_entities:['person.example'],show_thermostat:true,thermostat_entity:'climate.example',weather_entity:'weather.example',show_alarm:true,alarm_entity:'alarm_control_panel.example'};
window.hass={connected:true,states:{'weather.example':{state:'rainy',attributes:{temperature:8.4,temperature_unit:'°C',wind_speed:15,wind_speed_unit:'km/h'}},'person.example':{state:'office',attributes:{friendly_name:'Example resident'}},'zone.office':{state:'0',attributes:{friendly_name:'Office'}},'climate.example':{state:'heat',attributes:{current_temperature:20.5,temperature:21}},'alarm_control_panel.example':{state:'disarmed',attributes:{}},'light.example':{state:'on',attributes:{brightness:128}}},config:{unit_system:{temperature:'°C'}},themes:{darkMode:true},callService:async(...a)=>calls.push(a)};
window.card=document.querySelector('#house');card.setConfig(config);card.hass=hass;card.addEventListener('hass-more-info',e=>info.push(e.detail.entityId));
window.setWeather=(state,speed=15,unit='km/h')=>{hass={...hass,states:{...hass.states,'weather.example':{...hass.states['weather.example'],state,attributes:{...hass.states['weather.example'].attributes,wind_speed:speed,wind_speed_unit:unit}}}};card.hass=hass;};
window.setTheme=dark=>{document.documentElement.dataset.theme=dark?'dark':'light';hass={...hass,themes:{darkMode:dark}};card.hass=hass;};
window.setPhase=mode=>{card.config={...card.config,mode};card.draw();};
window.housePixels=()=>Array.from(card.shadowRoot.querySelector('.stage>canvas').getContext('2d').getImageData(0,0,64,48).data);
</script></html>
