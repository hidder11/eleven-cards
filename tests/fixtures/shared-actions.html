<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Shared action contract</title><style>body{margin:0;padding:16px;font:14px/1.4 system-ui;background:var(--primary-background-color);color:var(--primary-text-color)}#fixture{width:min(100%,440px)}#actions{padding:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--card-background-color);border-radius:var(--ha-card-border-radius)}#retry-slot{margin-top:16px}#retry-slot>*{display:block;width:100%}</style></head><body><main id="fixture"><div id="actions"></div><div id="retry-slot"></div></main><script src="../../review/ha-stub.js"></script><script src="../../cards/home-controls/dist/eleven-home-controls-card.js"></script><script src="../../cards/history-graph-card/dist/eleven-history-graph-card.js"></script><script src="../../cards/bar-chart/dist/eleven-bar-chart.js"></script><script src="../../cards/timeline-card/dist/eleven-timeline-card.js"></script><script src="../../cards/calendar-card/dist/eleven-calendar-card.js"></script><script src="../../cards/weather-card/dist/eleven-weather-card.js"></script><script src="../../cards/overview-card/dist/eleven-overview-card.js"></script><script src="../../cards/heatmap-card/dist/eleven-heatmap-card.js"></script><script type="module">
import {uiButton} from '../../shared/ui-button.js';
import {uiActionButtonStyles} from '../../shared/ui-action-button.js';
import {applyReviewTheme} from './shared-action-theme.js';
import {configs,createFixture} from '../../review/fixtures.js';
window.uiCalls=[];
const style=document.createElement('style');style.textContent=uiActionButtonStyles();document.head.append(style);
window.setActionTheme=(dark,paint)=>{applyReviewTheme(dark,paint);document.body.style.setProperty('--primary-color','#007db4');document.body.style.setProperty('--accent-color','#76509e');};
window.actionContrast=()=>{
 const canvas=document.createElement('canvas');canvas.width=canvas.height=1;const ctx=canvas.getContext('2d');
 const rgba=css=>{ctx.clearRect(0,0,1,1);ctx.fillStyle=css;ctx.fillRect(0,0,1,1);return [...ctx.getImageData(0,0,1,1).data]};
 const lum=c=>c.slice(0,3).map(x=>{x/=255;return x<=.04045?x/12.92:((x+.055)/1.055)**2.4}).reduce((v,x,i)=>v+x*[.2126,.7152,.0722][i],0);
 const ratio=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
 const contrast=(id,property)=>{const s=getComputedStyle(document.getElementById(id)),fg=rgba(s[property]),colors=(s.backgroundImage.match(/rgba?\([^)]*\)|color\(srgb[^)]*\)/g)||[]).map(rgba);if(!colors.length)colors.push(rgba(s.backgroundColor));return Math.min(...colors.map(bg=>ratio(fg,bg)))};
 return {choice:contrast('choice','color'),danger:contrast('danger','color'),focus:contrast('icon','outlineColor')};
};
window.resetActions=()=>{document.querySelector('#actions').innerHTML=[uiButton({variant:'action',text:'Uit',attrs:{id:'device-on','aria-pressed':true}}),uiButton({variant:'action-icon',content:'<ha-icon icon="mdi:plus" aria-hidden="true"></ha-icon>',label:'Hoger',attrs:{id:'icon'}}),uiButton({variant:'action-choice',text:'Vandaag',attrs:{id:'choice','aria-pressed':true}}),uiButton({variant:'action-danger',text:'Ja, resetten',attrs:{id:'danger'}}),uiButton({variant:'action',text:'Wachten',disabled:true,attrs:{id:'disabled'}}),uiButton({variant:'icon',content:'L',label:'Legacy',attrs:{id:'legacy'}})].join('');document.querySelector('#actions').onclick=e=>{const b=e.target.closest('button');if(b)uiCalls.push(b.id);};};
window.showRetry=async name=>{const slot=document.querySelector('#retry-slot');slot.replaceChildren();const card=document.createElement('eleven-'+name),row=configs.find(r=>r[0]===name);if(!row)throw Error('Unknown fixture '+name);card.hass=createFixture(name);card.setConfig({...row[2],card_background:false});slot.append(card);await new Promise(r=>setTimeout(r,150));window.retryCount=0;card._refresh=()=>{retryCount++;};if(name==='weather-card')card._syncForecast=()=>{retryCount++;};if(name==='calendar-card')card._startCalendars=()=>{retryCount++;};if(name==='weather-card'){card._forecastStatus='error';card._signature=null;}else if(name==='calendar-card'){card._statuses={'calendar.family':'error'};card._renderKey=null;}else{card._status='error';card._signature=null;}card._render();window.retryCard=card;return !!card.shadowRoot.querySelector('.retry,[data-retry]');};
window.showWaste=()=>{const card=document.createElement('eleven-waste-card'),row=configs.find(r=>r[0]==='waste-card');card.hass=createFixture('waste-card');card.setConfig({...row[2],card_background:false});document.querySelector('#retry-slot').replaceChildren(card);window.wasteCard=card;};
setActionTheme(false,'material');resetActions();window.actionReady=true;
</script></body></html>
