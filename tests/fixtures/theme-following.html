*{box-sizing:border-box}body{margin:0;padding:12px;font:14px/1.4 system-ui,sans-serif;background:var(--primary-background-color);color:var(--primary-text-color)}h1{font-size:18px}p{font-size:12px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));align-items:start;gap:20px}article{min-width:0}article>h2{font-size:14px;margin:0 0 8px}article>[data-card]{display:block;min-width:0}article>[data-chart]{height:440px}ha-card{display:block;border:var(--ha-card-border-width,1px) solid var(--ha-card-border-color,var(--divider-color));border-radius:var(--ha-card-border-radius,12px);background:var(--ha-card-background,var(--card-background-color));box-shadow:var(--ha-card-box-shadow,none)}
</style></head><body><h1>Eleven Cards — thema volgt Home Assistant</h1><p>Synthetische lokale fixtures, geen verbinding met Home Assistant, geen installatie. De House Card is uitgesloten.</p><main></main><script>customElements.define('ha-card',class extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'}).innerHTML='<style>:host{display:block;border:var(--ha-card-border-width,1px) solid var(--ha-card-border-color,var(--divider-color));border-radius:var(--ha-card-border-radius,12px);background:var(--ha-card-background,var(--card-background-color));box-shadow:var(--ha-card-box-shadow,none)}</style><slot></slot>';}});</script><script src="../../dist/eleven-cards.js"></script><script src="../../cards/home-controls/dist/eleven-home-controls-card.js"></script><script src="../../cards/room-card/dist/eleven-room-card.js"></script><script src="../../cards/appliance-planner/dist/eleven-appliance-planner.js"></script><script src="../../cards/scene-engine-card/dist/eleven-scene-engine-card.js"></script><script type="module">
const H=3600000,now=Date.now(),start=new Date().setHours(0,0,0,0),iso=t=>new Date(t).toISOString();
const sensor=(state,unit='',extra={})=>({state:String(state),attributes:{friendly_name:extra.friendly_name||'Voorbeeld',unit_of_measurement:unit,...extra}});
const prices=Array.from({length:192},(_,i)=>({start_time:iso(start+i*H/4),price_per_kwh:.14+Math.sin(i/8)*.12}));
const states={'scene_engine.living':sensor('scene.evening','',{engine:'Woonkamer',effective_request:{scene:'scene.evening',identifier:'Avond',priority:80},active_request_count:2,non_active_request_count:0}),'button.engine_reset':sensor('unknown'),'scene.evening':sensor('scening','',{friendly_name:'Avond'}),'light.living':sensor('on','',{friendly_name:'Woonkamer',brightness:160,supported_color_modes:['brightness']}),'climate.living':sensor('heat','',{friendly_name:'Thermostaat',temperature:20,current_temperature:20.8,min_temp:10,max_temp:30,target_temp_step:.5,supported_features:1,hvac_modes:['off','heat']}),'sensor.waste':sensor(iso(now+2*24*H).slice(0,10),'',{friendly_name:'Papier'}),'select.ev_mode':sensor('pv','',{options:['off','now','pv'],friendly_name:'Laadmodus'}),'sensor.power':sensor(418,'W'), 'sensor.solar':sensor(2800,'W'), 'sensor.temperature':sensor(20.8,'°C'), 'sensor.price':sensor(.24,'EUR/kWh',{data:prices}),'sensor.soc':sensor(62,'%'), 'sensor.range':sensor(284,'km'), 'sensor.odometer':sensor(98452,'km'),'switch.heating':sensor('on'), 'calendar.family':sensor('off'), 'todo.shopping':sensor(2,'',{supported_features:15,friendly_name:'Boodschappen'}),'weather.home':sensor('partlycloudy','',{temperature:16,temperature_unit:'°C',apparent_temperature:14,wind_speed:14,wind_speed_unit:'km/h',humidity:68,pressure:1017,pressure_unit:'hPa',visibility:12,visibility_unit:'km',uv_index:4,cloud_coverage:35,supported_features:3})};
const forecasts=Array.from({length:8},(_,i)=>({datetime:iso(now+(i+1)*H),condition:['partlycloudy','sunny','rainy'][i%3],temperature:15+i,templow:8,precipitation:i*.2}));
const prefs={energy_sources:[{type:'solar',stat_energy_from:'sensor.solar_energy',stat_rate:'sensor.solar'},{type:'grid',stat_energy_from:'sensor.grid_import',stat_energy_to:'sensor.grid_export',stat_rate:'sensor.power'}]};
window.demoServices=[];window.records=[];
const hass={language:'nl',locale:{language:'nl'},themes:{darkMode:false},connected:true,services:{button:{press:{}}},config:{time_zone:'Europe/Amsterdam',currency:'EUR'},states,
 connection:{subscribeMessage:async(cb,req)=>{let active=true;queueMicrotask(()=>{if(!active)return;if(req.type==='todo/item/subscribe')cb({items:[{uid:'milk',summary:'Melk',status:'needs_action'},{uid:'apples',summary:'Appels',status:'needs_action'},{uid:'bread',summary:'Brood',status:'completed'}]});else if(req.type==='calendar/event/subscribe')cb({events:[{summary:'Projectoverleg',start:iso(start+10*H),end:iso(start+11*H)},{summary:'Boodschappen halen',start:iso(start+15*H),end:iso(start+16*H)}]});else cb({forecast:forecasts});});return()=>{active=false};}},
 callApi:async(_,url)=>{const u=new URL(url,location.origin),ids=(u.searchParams.get('filter_entity_id')||'sensor.power').split(','),a=Date.parse(u.pathname.split('/').pop())||now-24*H,b=Date.parse(u.searchParams.get('end_time'))||now;return ids.map((id,j)=>Array.from({length:Math.max(2,Math.min(300,Math.ceil((b-a)/(H/2))))},(_,i)=>({entity_id:id,state:id==='switch.heating'?(i%4?'on':'off'):String(220+Math.sin(i/3+j)*100),attributes:states[id]?.attributes||{unit_of_measurement:'W'},last_changed:iso(a+i*(b-a)/Math.max(2,Math.min(300,Math.ceil((b-a)/(H/2)))))})))},
 callWS:async req=>{if(req.type==='config/entity_registry/list')return [];if(req.type==='energy/get_prefs')return prefs;if(req.type.endsWith('metadata'))return [{statistic_id:'sensor.power',mean_type:1,has_mean:true,has_sum:false,unit_of_measurement:'W'}];if(req.type==='recorder/statistics_during_period'){const a=Date.parse(req.start_time),b=Date.parse(req.end_time),step=req.period==='5minute'?H/12:req.period==='hour'?H:24*H;return Object.fromEntries((req.statistic_ids||['sensor.power']).map(id=>[id,Array.from({length:Math.ceil((b-a)/step)},(_,i)=>({start:a+i*step,mean:220+Math.sin(i)*80,change:1+i%3}))]));}throw Error('Unexpected synthetic WS '+req.type)},callService:async(...args)=>{demoServices.push(args);return {}}};
const configs=[
 ['history-graph-card','Historie',{entities:['sensor.power','sensor.temperature'],series_options:[{entity:'sensor.power',color:'#e78a14'},{entity:'sensor.temperature',color:'#2196f3'}],hours_to_show:24,sync_hover:false},true],
 ['bar-chart','Staafgrafiek',{entities:['sensor.power'],series_options:[{entity:'sensor.power',color:'#e78a14'}],hours_to_show:24,sync_hover:false},true],
 ['timeline-card','Tijdlijn',{entities:['switch.heating'],hours_to_show:24,sync_hover:false},true],
 ['dynamic-energy-price-card','Energieprijzen',{entity:'sensor.price'},true],
 ['overview-card','Sensoroverzicht',{entities:[{entity:'sensor.power',color:'#e78a14'},{entity:'sensor.temperature',color:'#2196f3'}]},false],
 ['heatmap-card','Heatmap',{entity:'sensor.power',hours_to_show:168},true],
 ['calendar-card','Agenda',{entities:[{entity:'calendar.family',color:[231,175,103]}],view:'list',days_to_show:2},false],
 ['weather-card','Weer',{entity:'weather.home',background:'halo',background_strength:0,animate_icons:false,animate_background:false},false],
 ['car-card','Auto',{percentage_entity:'sensor.soc',range_source:'entity',range_entity:'sensor.range',field_1_entity:'sensor.range',field_2_entity:'sensor.odometer',field_2_label:'Kilometerstand',background:'halo',background_strength:0,animate_background:false},false],
 ['energy-flow-card','Energiestromen',{default_view:'live',background:'halo',background_strength:0,animate_background:false},false],
 ['scene-engine-card','Scene Engine',{entity:'scene_engine.living',reset_entity:'button.engine_reset'},false],
 ['actions-card','Scènes en acties',{actions:['scene.evening']},false],
 ['controls-card','Bediening',{entities:['climate.living','light.living']},false],
 ['waste-card','Afvalinzameling',{entities:[{entity:'sensor.waste',name:'Papier',source:'date',color:'#2196f3'}]},false],
 ['room-card','Woonkamer',{name:'Woonkamer',lights:['light.living'],temperature_entity:'sensor.temperature'},false],
 ['appliance-planner','Apparatenplanner',{tariff:{source:'sensor',entity:'sensor.price'},appliances:[{id:'washer',name:'Wasmachine',kind:'washer',programs:[{id:'eco',name:'Eco 40–60',minutes:150,kwh:1}]}]},false],
 ['car-evcc','Auto met EVCC',{evcc_enabled:true,entity:'sensor.power',entities:{soc:'sensor.soc',power:'sensor.power',range:'sensor.range',mode:'select.ev_mode'},background:'halo',background_strength:0,animate_background:false},false],
 ['shopping-card','Boodschappen',{entity:'todo.shopping'},false],
];
for(const [name,title,config,chart] of configs){const article=document.createElement('article'),heading=document.createElement('h2'),card=document.createElement('eleven-'+(name==='car-evcc'?'car-card':name));heading.textContent=title;card.dataset.card=name;if(chart)card.dataset.chart='true';article.append(heading,card);document.querySelector('main').append(article);card.setConfig({type:'custom:eleven-'+name,title,...config});card.hass={...hass,...(['history-graph-card','bar-chart'].includes(name)?{callApi:(method,url)=>{const [path,...query]=url.split('?');return hass.callApi(method,decodeURIComponent(path)+(query.length?'?'+query.join('?'):''));}}:{})};records.push({name,card,hass:card._hass||hass});}
window.themeFixtureReady=true;
</script></body></html>
