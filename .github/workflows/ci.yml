name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    # Keep the OS compatible with the pinned Playwright browser dependencies.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and run all existing tests
        run: npm test
      - name: Check bundle syntax and committed build output
        run: |
          npm run check
          git diff --exit-code -- dist cards/*/dist experiments/material-house/dist
          git diff --check
      - name: Install browser smoke test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: python tests/browser-smoke.py
      - name: Car, Energy and Calendar issue layout regressions (synthetic HA)
        run: |
          python tests/browser-issues-53-56.py
          python tests/browser-issue-57.py
      - name: Camera interaction and theme regressions (synthetic HA)
        run: |
          export CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          node tests/browser-camera.mjs
      - name: Energy, EVCC and Weather browser regressions (synthetic HA)
        run: |
          export CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          node tests/browser-energy-flow.mjs
          node tests/browser-car-evcc.mjs
          node tests/browser-weather.mjs
      - name: All-card cold-start render and migration regressions (synthetic HA)
        run: python tests/browser-all-cards-render.py
      - name: All-card update bursts and resource cleanup (synthetic HA)
        run: python tests/browser-performance-stability.py PerformanceStabilityAudit.test_04_update_bursts_reconnects_and_resource_cleanup
      - name: History axis and legend units (synthetic HA, no screenshots)
        run: |
          python tests/browser-history-axis-units.py
          HISTORY_UNITS_ARTIFACT=standalone python tests/browser-history-axis-units.py
      - name: Decorative background defaults and graph exclusion (synthetic HA)
        run: |
          python tests/browser-background-default.py
          python tests/browser-background-graph-exclusion.py
          BACKGROUND_GRAPH_ARTIFACT=standalones python tests/browser-background-graph-exclusion.py
          python tests/browser-plot-inset-theme.py
          PLOT_THEME_ARTIFACT=standalones python tests/browser-plot-inset-theme.py
      - name: Scene disclosure scroll stability (synthetic HA)
        run: |
          SCENE_SCROLL_MODE=source python tests/browser-scene-scroll-stability.py
          SCENE_SCROLL_MODE=standalone python tests/browser-scene-scroll-stability.py
          SCENE_SCROLL_MODE=collection python tests/browser-scene-scroll-stability.py
      - name: Shopping card browser regressions (synthetic HA)
        run: BUILT=1 python cards/shopping-card/tests/browser_test.py
      - name: House card browser regressions (synthetic HA)
        run: python cards/house-card/tests/browser-house.py
